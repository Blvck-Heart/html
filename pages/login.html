<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="form-container">
      <form>
        <h1>Welcome Back</h1>
        <p class="hr-p">LOGIN WITH EMAIL</p>

        <div class="email">
          <label for="email">Email Address</label> <br />
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter email"
          />
        </div>

        <div class="pass">
          <label for="password">Password</label> <br />
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Password"
          />
        </div>

        <div class="mid">
          <input type="checkbox" name="stay-log" id="stay-log" />
          <label for="stay-log">Keep me logged in</label>

          <div class="forgot">
            <a href="#">Forgot your password?</a>
          </div>
        </div>

        <div class="submit-btn">
          <input type="submit" value="Log in" />
        </div>

        <hr />

        <div class="dha">
          <p>Don't have an account?</p> 
          <a href="/pages/sign-up.html">Sign up here</a>
        </div>
      </form>
    </div>
  </body>
</html>
